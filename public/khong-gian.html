<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không gian làm việc — Đa Khoa Đức Minh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500;1,600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#f7f4ee; --surface:#ffffff; --surface-2:#f1ede3; --ink:#142e29; --ink-muted:#52685f;
    --line:#dfdacc; --accent:#0e8e7d; --accent-deep:#0b6f62; --on-accent:#f6fbf9;
    --shadow: 0 18px 40px -22px rgba(20,46,41,.35);
    --role:#0e8e7d; --role-soft:#d7f0ea;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0e1f1c; --surface:#142e29; --surface-2:#193732; --ink:#ecece2; --ink-muted:#9fb4ac;
      --line:#26443d; --accent:#38c8b1; --accent-deep:#2ba892; --on-accent:#08201c;
      --shadow: 0 18px 40px -18px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0e1f1c; --surface:#142e29; --surface-2:#193732; --ink:#ecece2; --ink-muted:#9fb4ac;
    --line:#26443d; --accent:#38c8b1; --accent-deep:#2ba892; --on-accent:#08201c;
    --shadow: 0 18px 40px -18px rgba(0,0,0,.6);
  }
  /* Mỗi vai trò 1 màu nhấn riêng để nhìn là biết đang ở không gian nào. */
  body[data-role="admin"]{ --role:#7c3aed; --role-soft:#ece1ff; }
  body[data-role="doctor"]{ --role:#2563eb; --role-soft:#dbe8ff; }
  body[data-role="staff"]{ --role:#c2710c; --role-soft:#ffe9cc; }
  body[data-role="patient"]{ --role:#0e8e7d; --role-soft:#d7f0ea; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) body[data-role="admin"]{ --role:#a78bfa; --role-soft:#2a2050; }
    :root:not([data-theme="light"]) body[data-role="doctor"]{ --role:#7aa7ff; --role-soft:#182a52; }
    :root:not([data-theme="light"]) body[data-role="staff"]{ --role:#f0b25a; --role-soft:#3a2a10; }
    :root:not([data-theme="light"]) body[data-role="patient"]{ --role:#38c8b1; --role-soft:#123a34; }
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  [hidden]{display:none !important;}
  body{margin:0; background:var(--ground); color:var(--ink); font-family:"Be Vietnam Pro",system-ui,sans-serif; line-height:1.55;}
  header{background:var(--surface); border-bottom:1px solid var(--line); border-top:4px solid var(--role);}
  header .bar{max-width:1040px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .brand{font-family:"Lora",serif; font-weight:600; font-size:1.15rem; text-decoration:none; color:var(--ink);}
  .brand em{color:var(--accent-deep); font-style:normal;}
  .wrap{max-width:1040px; margin:0 auto; padding:28px 20px 60px;}

  .hero{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
  .badge{display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:4px 12px; border-radius:20px; background:var(--role-soft); color:var(--role);}
  h1{font-family:"Lora",serif; font-weight:600; font-size:clamp(1.6rem,3vw,2.2rem); margin:8px 0 4px;}
  .sub{color:var(--ink-muted); margin:0; font-size:.95rem;}
  .switch{display:flex; gap:8px;}
  .switch a{font-size:.85rem; font-weight:600; text-decoration:none; padding:9px 16px; border-radius:10px; border:1px solid var(--line); color:var(--ink); background:var(--surface);}
  .switch a:hover{border-color:var(--role);}
  .switch a.on{background:var(--role); color:#fff; border-color:var(--role);}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:26px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; border-left:4px solid var(--role);}
  .stat .n{font-family:"Lora",serif; font-size:2rem; font-weight:600; line-height:1.1;}
  .stat .l{font-size:.8rem; color:var(--ink-muted); margin-top:4px;}

  h2{font-size:.78rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-muted); margin:0 0 12px;}
  .tools{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-bottom:28px;}
  .tool{display:block; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; transition:transform .15s, box-shadow .15s, border-color .15s;}
  .tool:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--role);}
  .tool .ic{width:38px; height:38px; border-radius:10px; background:var(--role-soft); color:var(--role); display:grid; place-items:center; font-size:1.15rem; margin-bottom:10px;}
  .tool b{display:block; font-size:.98rem; margin-bottom:2px;}
  .tool span{font-size:.82rem; color:var(--ink-muted);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow);}
  .list{list-style:none; margin:0; padding:0;}
  .list li{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.9rem;}
  .list li:last-child{border-bottom:0;}
  .list .meta{color:var(--ink-muted); font-size:.8rem;}
  .pill{padding:2px 10px; border-radius:20px; font-size:.7rem; font-weight:600; white-space:nowrap; background:var(--role-soft); color:var(--role); align-self:center;}
  .empty{color:var(--ink-muted); margin:0; font-size:.9rem;}
  .center{max-width:420px; margin:80px auto; text-align:center;}
  .btn{display:inline-block; margin-top:12px; padding:10px 20px; border-radius:10px; background:var(--accent); color:var(--on-accent); font-weight:600; text-decoration:none;}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a href="/" class="brand">Đa Khoa <em>Đức Minh</em></a>
    <div id="accountMount"></div>
  </div>
</header>

<div class="wrap" id="app" hidden>
  <div class="hero">
    <div>
      <span class="badge" id="roleBadge"></span>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="switch">
      <a href="/">Giao diện chung</a>
      <a href="/khong-gian.html" class="on" id="wsLink"></a>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <h2>Công cụ của bạn</h2>
  <div class="tools" id="tools"></div>

  <h2 id="listTitle"></h2>
  <div class="card"><ul class="list" id="list"></ul></div>
</div>

<div class="center" id="needLogin" hidden>
  <h1>Bạn chưa đăng nhập</h1>
  <p class="sub">Đăng nhập để vào không gian làm việc riêng của tài khoản.</p>
  <a class="btn" href="/tai-khoan.html">Đăng nhập</a>
</div>

<script src="/account-menu.js" data-mount="#accountMount" data-current="workspace"></script>
<script>
(function () {
  const token = localStorage.getItem('dm_token');
  const STATUS = { cho_xac_nhan: 'Chờ xác nhận', da_xac_nhan: 'Đã xác nhận', da_checkin: 'Đã check-in', dang_kham: 'Đang khám', hoan_thanh: 'Hoàn thành', da_huy: 'Đã huỷ' };
  const ROLE = {
    admin:   { badge: 'Quản trị viên',     ws: 'Không gian quản trị',  hi: 'Bảng điều khiển quản trị', sub: 'Quản lý tài khoản, danh mục, giá và tri thức AI của phòng khám.' },
    doctor:  { badge: 'Bác sĩ',            ws: 'Không gian bác sĩ',    hi: 'Không gian bác sĩ',        sub: 'Lịch khám của bạn hôm nay và các công cụ khám bệnh.' },
    staff:   { badge: 'Nhân viên tư vấn',  ws: 'Không gian nhân viên', hi: 'Không gian nhân viên',     sub: 'Tiếp đón, xác nhận lịch hẹn và thu ngân trong ngày.' },
    patient: { badge: 'Bệnh nhân',         ws: 'Không gian bệnh nhân', hi: 'Không gian của bạn',       sub: 'Đặt lịch, theo dõi lịch hẹn và xem lại hồ sơ khám bệnh.' },
  };
  const TOOLS = {
    admin: [
      ['👥', 'Quản lý tài khoản', 'Thêm bác sĩ/nhân viên, phân quyền', '/tai-khoan.html'],
      ['📋', 'Hàng đợi khám', 'Toàn bộ lịch hẹn theo ngày', '/hang-doi.html'],
      ['💊', 'Danh mục thuốc & giá', 'Thuốc, tương tác, giá khám', '/danh-muc-thuoc.html'],
      ['🧾', 'Hoá đơn', 'Lập và xác nhận thu tiền', '/hoa-don.html'],
      ['🧠', 'Cơ sở tri thức AI', 'Tài liệu cho trợ lý AI', '/co-so-tri-thuc.html'],
    ],
    doctor: [
      ['📋', 'Hàng đợi khám', 'Bệnh nhân chờ khám hôm nay', '/hang-doi.html'],
      ['🩺', 'Khám bệnh', 'Mở từ hàng đợi: chẩn đoán, kê đơn', '/hang-doi.html'],
      ['👤', 'Thông tin tài khoản', 'Hồ sơ cá nhân', '/tai-khoan.html'],
    ],
    staff: [
      ['📋', 'Hàng đợi khám', 'Xác nhận, check-in lịch hẹn', '/hang-doi.html'],
      ['🧾', 'Hoá đơn', 'Lập hoá đơn, thu tiền', '/hoa-don.html'],
      ['📅', 'Đặt lịch hộ', 'Trang đặt lịch khám', '/dat-lich.html'],
    ],
    patient: [
      ['📅', 'Đặt lịch khám', 'Chọn chuyên khoa, bác sĩ, giờ', '/dat-lich.html'],
      ['📁', 'Hồ sơ khám bệnh', 'Lịch sử khám, đơn thuốc, hoá đơn', '/ho-so.html'],
      ['👤', 'Thông tin tài khoản', 'Hồ sơ cá nhân', '/tai-khoan.html'],
    ],
  };

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  async function api(path) {
    const res = await fetch(path, { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('Lỗi ' + res.status));
    return data;
  }
  const safe = (p, fallback) => p.catch(() => fallback);

  function setStats(items) {
    document.getElementById('stats').innerHTML = items.map(([n, l]) =>
      `<div class="stat"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join('');
  }
  function setList(title, rows, emptyText) {
    document.getElementById('listTitle').textContent = title;
    document.getElementById('list').innerHTML = rows.length
      ? rows.map((r) => `<li><div><b>${esc(r.main)}</b><div class="meta">${esc(r.meta)}</div></div><span class="pill">${esc(r.pill)}</span></li>`).join('')
      : `<li><p class="empty">${esc(emptyText)}</p></li>`;
  }
  const apptRow = (a, who) => ({
    main: `${a.time} · ${who === 'doctor' ? 'BN ' + a.patientName : a.patientName}`,
    meta: `${a.specialty}${a.doctorName ? ' · BS. ' + a.doctorName : ''}`,
    pill: STATUS[a.status] || a.status,
  });

  async function load(user) {
    const cfg = ROLE[user.role] || ROLE.patient;
    document.body.dataset.role = user.role;
    document.getElementById('roleBadge').textContent = cfg.badge;
    document.getElementById('title').textContent = cfg.hi + ' — ' + user.name;
    document.getElementById('subtitle').textContent = cfg.sub;
    document.getElementById('wsLink').textContent = cfg.ws;
    document.getElementById('tools').innerHTML = (TOOLS[user.role] || TOOLS.patient).map(([ic, t, d, href]) =>
      `<a class="tool" href="${href}"><div class="ic">${ic}</div><b>${esc(t)}</b><span>${esc(d)}</span></a>`).join('');
    document.getElementById('app').hidden = false;

    const t = today();
    if (user.role === 'admin') {
      const [users, appts, unpaid] = await Promise.all([
        safe(api('/api/admin/users'), { users: [] }),
        safe(api('/api/appointments?date=' + t), { appointments: [] }),
        safe(api('/api/billing/invoices?status=chua_thanh_toan'), { invoices: [] }),
      ]);
      const c = (r) => users.users.filter((u) => u.role === r).length;
      setStats([
        [users.users.length, 'Tổng tài khoản'],
        [c('doctor') + ' / ' + c('staff'), 'Bác sĩ / Nhân viên'],
        [appts.appointments.length, 'Lịch hẹn hôm nay'],
        [unpaid.invoices.length, 'Hoá đơn chưa thanh toán'],
      ]);
      setList('Lịch hẹn hôm nay', appts.appointments.map((a) => apptRow(a)), 'Hôm nay chưa có lịch hẹn.');
    } else if (user.role === 'doctor') {
      const { appointments } = await safe(api('/api/appointments?date=' + t), { appointments: [] });
      const mine = appointments.filter((a) => a.doctorId === user.id && a.status !== 'da_huy');
      const n = (s) => mine.filter((a) => a.status === s).length;
      setStats([
        [mine.length, 'Lịch của bạn hôm nay'],
        [n('da_checkin'), 'Đã check-in, chờ khám'],
        [n('dang_kham'), 'Đang khám'],
        [n('hoan_thanh'), 'Đã khám xong'],
      ]);
      setList('Lịch khám của bạn hôm nay', mine.map((a) => apptRow(a, 'doctor')), 'Hôm nay bạn chưa có lịch khám.');
    } else if (user.role === 'staff') {
      const [appts, unpaid] = await Promise.all([
        safe(api('/api/appointments?date=' + t), { appointments: [] }),
        safe(api('/api/billing/invoices?status=chua_thanh_toan'), { invoices: [] }),
      ]);
      const list = appts.appointments.filter((a) => a.status !== 'da_huy');
      const n = (s) => list.filter((a) => a.status === s).length;
      setStats([
        [list.length, 'Lịch hẹn hôm nay'],
        [n('cho_xac_nhan'), 'Chờ xác nhận'],
        [n('da_checkin') + n('dang_kham'), 'Đang tại phòng khám'],
        [unpaid.invoices.length, 'Hoá đơn chưa thanh toán'],
      ]);
      setList('Việc cần xử lý hôm nay', list.filter((a) => a.status === 'cho_xac_nhan' || a.status === 'da_xac_nhan').map((a) => apptRow(a)), 'Không có lịch nào đang chờ xử lý.');
    } else {
      const [appts, recs] = await Promise.all([
        safe(api('/api/appointments/mine'), { appointments: [] }),
        safe(api('/api/clinical/records/mine'), { records: [] }),
      ]);
      const upcoming = appts.appointments
        .filter((a) => a.date.slice(0, 10) >= t && !['da_huy', 'hoan_thanh'].includes(a.status))
        .sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));
      setStats([
        [upcoming.length, 'Lịch hẹn sắp tới'],
        [(recs.records || []).length, 'Lần khám đã có hồ sơ'],
      ]);
      setList('Lịch hẹn sắp tới', upcoming.map((a) => ({
        main: `${a.date.slice(0, 10)} · ${a.time}`,
        meta: `${a.specialty}${a.doctorName ? ' · BS. ' + a.doctorName : ''}`,
        pill: STATUS[a.status] || a.status,
      })), 'Bạn chưa có lịch hẹn nào sắp tới.');
    }
  }

  if (!token) { document.getElementById('needLogin').hidden = false; return; }
  fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
    .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
    .then(({ user }) => load(user))
    .catch(() => { localStorage.removeItem('dm_token'); document.getElementById('needLogin').hidden = false; });
})();
</script>
</body>
</html>
