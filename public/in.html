<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In chứng từ — Đa Khoa Đức Minh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  :root{ --ink:#142e29; --muted:#52685f; --line:#c9d3cf; --accent:#0b6f62; }
  *{box-sizing:border-box;}
  body{margin:0; background:#e9ece9; color:var(--ink); font-family:"Be Vietnam Pro",system-ui,sans-serif; font-size:14px; line-height:1.5;}
  .toolbar{position:sticky; top:0; background:#142e29; color:#fff; padding:10px 20px; display:flex; gap:10px; align-items:center; justify-content:space-between; z-index:5;}
  .toolbar a{color:#cfe; text-decoration:none; font-size:.85rem;}
  .toolbar button{font:inherit; font-weight:600; background:#0e8e7d; color:#fff; border:0; border-radius:3px; padding:9px 18px; cursor:pointer;}
  .toolbar small{opacity:.8;}
  .sheet{background:#fff; width:210mm; min-height:297mm; margin:18px auto; padding:16mm 16mm 20mm; box-shadow:0 8px 30px rgba(0,0,0,.15);}
  .clinic{display:flex; justify-content:space-between; gap:16px; border-bottom:2px solid var(--accent); padding-bottom:10px; margin-bottom:14px;}
  .clinic .name{font-family:"Lora",serif; font-weight:600; font-size:1.35rem;}
  .clinic .name em{color:var(--accent); font-style:normal;}
  .clinic .info{font-size:.8rem; color:var(--muted); text-align:right;}
  .doc-title{text-align:center; margin:6px 0 14px;}
  .doc-title h1{font-family:"Lora",serif; font-size:1.5rem; margin:0; letter-spacing:.04em;}
  .doc-title .code{font-weight:700; color:var(--accent); font-size:1rem;}
  .doc-title .date{color:var(--muted); font-size:.85rem;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 24px; margin-bottom:12px;}
  .grid div span{color:var(--muted);}
  .block{margin:10px 0;}
  .block b{display:block; font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:2px;}
  table{width:100%; border-collapse:collapse; margin:8px 0;}
  th,td{border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top;}
  th{background:#f0f5f3; font-size:.78rem; text-transform:uppercase; letter-spacing:.03em;}
  td.num,th.num{text-align:right; white-space:nowrap;}
  .total{display:flex; justify-content:flex-end; gap:24px; font-size:1.1rem; font-weight:700; margin-top:8px;}
  .stamp{display:inline-block; border:2px solid; border-radius:3px; padding:2px 12px; font-weight:700; transform:rotate(-4deg);}
  .stamp.paid{color:#0b7a4a;} .stamp.unpaid{color:#b45309;}
  .sign{display:flex; justify-content:space-between; margin-top:34px; text-align:center;}
  .sign div{width:44%;} .sign small{color:var(--muted);} .sign .who{margin-top:56px; font-weight:600;}
  .foot{margin-top:24px; font-size:.75rem; color:var(--muted); text-align:center; border-top:1px dashed var(--line); padding-top:8px;}
  .err{max-width:520px; margin:80px auto; text-align:center; background:#fff; padding:28px; border-radius:3px;}
  [hidden]{display:none !important;}
  @media print{
    body{background:#fff;}
    .toolbar{display:none;}
    .sheet{margin:0; box-shadow:none; width:auto; min-height:0; padding:0;}
    @page{size:A4; margin:14mm;}
  }
</style>
</head>
<body>
<div class="toolbar" id="toolbar" hidden>
  <a href="javascript:history.back()">← Quay lại</a>
  <span><small>Bấm In rồi chọn "Lưu dưới dạng PDF" để tải file PDF</small></span>
  <button type="button" onclick="window.print()">🖨 In / Lưu PDF</button>
</div>
<div class="err" id="err" hidden></div>
<div class="sheet" id="sheet" hidden></div>

<script src="/invoice-sheet.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const type = params.get('type');
  const id = Number(params.get('id'));
  const token = localStorage.getItem('dm_token');

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const money = (n) => Number(n).toLocaleString('vi-VN') + 'đ';
  const fmtDate = (d) => { const s = String(d).slice(0, 10).split('-'); return s[2] + '/' + s[1] + '/' + s[0]; };
  const GENDER = { nam: 'Nam', nu: 'Nữ', khac: 'Khác' };
  const METHOD = { tien_mat: 'Tiền mặt', chuyen_khoan: 'Chuyển khoản' };

  function fail(msg) {
    const el = document.getElementById('err');
    el.textContent = msg;
    el.hidden = false;
  }
  async function api(path) {
    const res = await fetch(path, { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('Lỗi ' + res.status));
    return data;
  }

  const head = `
    <div class="clinic">
      <div class="name">Đa Khoa <em>Đức Minh</em></div>
      <div class="info">Phường Túc Duyên, TP. Thái Nguyên<br>Hotline: 0974 755 333<br>Thứ 2 – Thứ 7 · 7:00 – 21:00</div>
    </div>`;

  function prescription(r) {
    const rows = r.items.length
      ? r.items.map((it, i) => `<tr><td>${i + 1}</td><td><b>${esc(it.medicineName)}</b></td><td>${esc(it.dosage)}</td><td class="num">${esc(it.quantity)} ${esc(it.unit)}</td></tr>`).join('')
      : '<tr><td colspan="4">Không kê đơn thuốc.</td></tr>';
    return head + `
      <div class="doc-title"><h1>ĐƠN THUỐC</h1><div class="code">Số: ${esc(r.code)}</div><div class="date">Ngày khám: ${fmtDate(r.date)}</div></div>
      <div class="grid">
        <div><span>Bệnh nhân:</span> <b>${esc(r.patientName)}</b></div>
        <div><span>Tuổi / Giới:</span> ${r.patientAge != null ? esc(r.patientAge) : '—'} / ${esc(GENDER[r.patientGender] || '—')}</div>
        <div><span>Điện thoại:</span> ${esc(r.patientPhone || '—')}</div>
        <div><span>Chuyên khoa:</span> ${esc(r.specialty)}</div>
      </div>
      ${r.symptoms ? `<div class="block"><b>Triệu chứng</b>${esc(r.symptoms)}</div>` : ''}
      <div class="block"><b>Chẩn đoán</b>${esc(r.diagnosis)}</div>
      <table>
        <thead><tr><th style="width:36px">#</th><th>Tên thuốc</th><th>Liều dùng</th><th class="num">Số lượng</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${r.notes ? `<div class="block"><b>Lời dặn</b>${esc(r.notes)}</div>` : ''}
      <div class="sign"><div></div><div><small>Ngày ${fmtDate(r.date)}<br>Bác sĩ khám bệnh</small><div class="who">BS. ${esc(r.doctorName)}</div></div></div>
      <div class="foot">Đơn thuốc chỉ có giá trị khi có chữ ký bác sĩ. Dùng thuốc đúng liều bác sĩ chỉ định; khám lại nếu triệu chứng nặng hơn.</div>`;
  }

  function report(data) {
    const periodLabel = (p) => data.group === 'month' ? p.replace('-', '/') : fmtDate(p);
    const revRows = data.revenue.length
      ? data.revenue.map((r) => `<tr><td>${periodLabel(r.period)}</td><td class="num">${r.invoices}</td><td class="num">${money(r.total)}</td></tr>`).join('')
      : '<tr><td colspan="3">Chưa có doanh thu trong khoảng này.</td></tr>';
    const specRows = data.specialties.length
      ? data.specialties.map((s) => `<tr><td>${esc(s.specialty)}</td><td class="num">${s.total}</td><td class="num">${s.completed}</td><td class="num">${s.cancelled}</td></tr>`).join('')
      : '<tr><td colspan="4">Chưa có lịch hẹn trong khoảng này.</td></tr>';
    return head + `
      <div class="doc-title"><h1>BÁO CÁO THỐNG KÊ</h1><div class="date">Từ ${fmtDate(data.from)} đến ${fmtDate(data.to)} · theo ${data.group === 'month' ? 'tháng' : 'ngày'}</div></div>
      <div class="grid">
        <div><span>Doanh thu đã thu:</span> <b>${money(data.summary.revenue)}</b></div>
        <div><span>Số hoá đơn đã thu:</span> ${data.summary.paidInvoices}</div>
        <div><span>Công nợ chưa thu (toàn hệ thống):</span> ${money(data.summary.unpaidAmount)}</div>
        <div><span>Số hoá đơn chưa thu:</span> ${data.summary.unpaidInvoices}</div>
        <div><span>Số lịch hẹn trong khoảng:</span> ${data.summary.appointments}</div>
      </div>
      <div class="block"><b>Doanh thu theo ${data.group === 'month' ? 'tháng' : 'ngày'}</b></div>
      <table>
        <thead><tr><th>${data.group === 'month' ? 'Tháng' : 'Ngày'}</th><th class="num">Số hoá đơn</th><th class="num">Doanh thu</th></tr></thead>
        <tbody>${revRows}</tbody>
      </table>
      <div class="block"><b>Số ca khám theo chuyên khoa</b></div>
      <table>
        <thead><tr><th>Chuyên khoa</th><th class="num">Tổng</th><th class="num">Hoàn thành</th><th class="num">Huỷ</th></tr></thead>
        <tbody>${specRows}</tbody>
      </table>
      <div class="foot">Doanh thu tính theo hoá đơn đã thu tiền, theo ngày thu — Báo cáo xuất lúc ${new Date().toLocaleString('vi-VN')}.</div>`;
  }

  // Hoá đơn dùng chung bố cục Phiếu thu đầy đủ thông tin với cửa sổ "Xem chi tiết" (xem /invoice-sheet.js).
  function invoice(inv) {
    window.InvoiceSheet.ensureCss();
    return window.InvoiceSheet.html(inv);
  }

  (async function () {
    if (!token) return fail('Bạn cần đăng nhập để in chứng từ.');
    if (!['dt', 'hd', 'baocao'].includes(type)) return fail('Đường dẫn in không hợp lệ.');
    if (type !== 'baocao' && !Number.isInteger(id)) return fail('Đường dẫn in không hợp lệ.');
    try {
      let html, code;
      if (type === 'dt') { const { record } = await api('/api/clinical/records/' + id); html = prescription(record); code = record.code; }
      else if (type === 'hd') { const { invoice: inv } = await api('/api/billing/invoices/' + id); html = invoice(inv); code = inv.code; }
      else {
        const group = params.get('group') === 'month' ? 'month' : 'day';
        const qs = new URLSearchParams({ group });
        if (params.get('from')) qs.set('from', params.get('from'));
        if (params.get('to')) qs.set('to', params.get('to'));
        const data = await api('/api/stats?' + qs.toString());
        html = report(data);
        code = 'Bao-cao-thong-ke_' + data.from + '_' + data.to;
      }
      document.title = code + ' — Đa Khoa Đức Minh';
      const sheet = document.getElementById('sheet');
      sheet.innerHTML = html;
      sheet.hidden = false;
      document.getElementById('toolbar').hidden = false;
    } catch (e) { fail(e.message); }
  })();
})();
</script>
</body>
</html>
