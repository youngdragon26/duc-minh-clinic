<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồ sơ khám bệnh — Đa Khoa Đức Minh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#f7f4ee; --surface:#fff; --surface-2:#f1ede3; --ink:#142e29; --ink-muted:#52685f;
    --line:#dfdacc; --accent:#0e8e7d; --accent-deep:#0b6f62;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0e1f1c; --surface:#142e29; --surface-2:#193732; --ink:#ecece2; --ink-muted:#9fb4ac;
      --line:#26443d; --accent:#38c8b1; --accent-deep:#2ba892;
    }
  }
  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{border-bottom:1px solid var(--line);}
  header .bar{max-width:680px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between;}
  .brand{font-family:"Lora",serif; font-weight:600; font-size:1.6rem; text-decoration:none; color:var(--ink);}
  .brand em{color:var(--accent-deep); font-style:normal;}
  .back{font-size:.82rem; text-decoration:none; color:var(--ink-muted);}
  .back:hover{color:var(--ink);}

  .wrap{max-width:680px; margin:0 auto; padding:32px 20px 48px;}
  h1{font-family:"Lora",serif; font-size:1.4rem; margin:0 0 4px;}
  .sub{color:var(--ink-muted); font-size:.88rem; margin-bottom:24px; line-height:1.6;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:20px 22px; margin-bottom:16px;}
  .record-head{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
  .record-head b{font-family:"Lora",serif; font-size:1.02rem;}
  .record-head span{font-size:.8rem; color:var(--ink-muted);}
  .field{margin-top:8px; font-size:.88rem; line-height:1.55;}
  .field b{color:var(--ink-muted); font-weight:600; font-size:.76rem; text-transform:uppercase; letter-spacing:.03em; display:block; margin-bottom:2px;}
  ul.rx{margin:4px 0 0; padding-left:18px; font-size:.86rem; line-height:1.7;}
  .empty{color:var(--ink-muted); font-size:.9rem;}
  .pill{padding:2px 9px; border-radius:20px; font-size:.72rem; font-weight:600; white-space:nowrap; display:inline-block;}
  .pill.chua_thanh_toan{background:#fdf0d0; color:#8a5a00;}
  .pill.da_thanh_toan{background:#d7f0ea; color:var(--accent-deep);}
  .money{font-variant-numeric:tabular-nums; font-weight:600;}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a href="/" class="brand">Đa Khoa <em>Đức Minh</em></a>
    <a href="/khong-gian.html" class="back" style="margin-right:14px;">Không gian của tôi</a>
    <a href="/dat-lich.html" class="back">← Đặt lịch khám</a>
  </div>
</header>

<div class="wrap">
  <h1>Hồ sơ khám bệnh</h1>
  <p class="sub">Lịch sử khám và đơn thuốc đã được bác sĩ kê cho bạn.</p>

  <div class="card" id="needLoginCard" hidden>
    <p style="margin:0 0 12px;">Bạn cần đăng nhập để xem hồ sơ khám bệnh.</p>
    <a href="/tai-khoan.html" class="back" style="text-decoration:underline;">Đăng nhập / Đăng ký →</a>
  </div>

  <div id="list"></div>
  <div class="card empty" id="emptyCard" hidden>Bạn chưa có hồ sơ khám bệnh nào.</div>
</div>

<script src="/invoice-sheet.js"></script>
<script>
  const API = '';
  const token = localStorage.getItem('dm_token');

  const STATUS_LABELS = { chua_thanh_toan: 'Chưa thanh toán', da_thanh_toan: 'Đã thanh toán' };
  const PAYMENT_METHOD_LABELS = { tien_mat: 'Tiền mặt', chuyen_khoan: 'Chuyển khoản' };
  function money(n) { return Number(n).toLocaleString('vi-VN') + 'đ'; }

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) },
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('Lỗi ' + res.status));
    return data;
  }

  // Thông tin nhận thanh toán chỉ cần lấy 1 lần cho cả trang (dùng chung cho mọi hoá đơn).
  let bankAccountPromise = null;
  function getBankAccount() {
    if (!bankAccountPromise) {
      bankAccountPromise = api('/api/billing/bank-account').then(r => r.bankAccount).catch(() => ({ configured: false }));
    }
    return bankAccountPromise;
  }

  const invoiceById = {}; // hoá đơn đã tải, để mở lại xem chi tiết không cần gọi API lần nữa

  async function invoiceHtml(appointmentId) {
    try {
      const { invoice } = await api('/api/billing/invoices/by-appointment/' + appointmentId);
      const methodPart = invoice.paymentMethod ? ` · ${PAYMENT_METHOD_LABELS[invoice.paymentMethod]}` : '';
      invoiceById[invoice.id] = invoice;
      const base = `<div class="field"><b>Hoá đơn ${invoice.code}</b><span class="money">${money(invoice.totalAmount)}</span> · <span class="pill ${invoice.status}">${STATUS_LABELS[invoice.status]}</span>${methodPart} · <button type="button" class="view-invoice" data-invoice-id="${invoice.id}" style="font:inherit; font-size:.85rem; font-weight:600; color:var(--accent-deep); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline;">👁 Xem chi tiết</button> · <a href="/in.html?type=hd&id=${invoice.id}" target="_blank">🖨 In hoá đơn</a></div>`;

      if (invoice.status !== 'chua_thanh_toan') return base;

      const bank = await getBankAccount();
      // Chưa có tài khoản nhận tiền thì không sinh được mã QR — báo rõ để bệnh nhân
      // biết cách thanh toán thay vì phần thanh toán biến mất không lý do.
      if (!bank.configured) {
        return base + `<div class="field"><b>Thanh toán</b>Phòng khám chưa mở thanh toán chuyển khoản QR online. Bạn vui lòng thanh toán tại quầy thu ngân hoặc gọi hotline 0974 755 333.</div>`;
      }

      const addInfo = encodeURIComponent((invoice.code + ' ' + (invoice.patientName || '')).trim());
      const accountName = encodeURIComponent(bank.accountName || '');
      const qrUrl = `https://img.vietqr.io/image/${bank.bankBin}-${bank.accountNumber}-compact2.png?amount=${invoice.totalAmount}&addInfo=${addInfo}&accountName=${accountName}`;
      // Đã báo chuyển khoản: vẫn giữ mã QR (lỡ bấm trước khi chuyển thì quét lại được),
      // thay nút bấm bằng khung tự kiểm tra trạng thái — xem watchPayment() bên dưới.
      const action = invoice.onlinePaymentClaimedAt
        ? `<div class="pay-watch" data-invoice-id="${invoice.id}" style="margin-top:8px; padding:9px 12px; border-radius:3px; border:1px solid var(--line); font-size:.85rem;">
             Bạn đã báo chuyển khoản lúc ${new Date(invoice.onlinePaymentClaimedAt).toLocaleString('vi-VN')}. Đang chờ xác nhận…
           </div>`
        : `<button type="button" class="claim-online-paid" data-invoice-id="${invoice.id}"
             style="margin-top:8px; padding:7px 12px; border-radius:3px; border:1px solid var(--line); background:transparent; cursor:pointer; font-size:.82rem; color:var(--ink); font-family:inherit;">
             Tôi đã chuyển khoản
           </button>`;
      return base + `
        <div class="field">
          <b>Thanh toán QR online</b>
          <div style="display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; margin-top:4px;">
            <img src="${qrUrl}" alt="Mã QR chuyển khoản" width="160" height="160" style="border-radius:3px; border:1px solid var(--line);">
            <div style="flex:1; min-width:180px;">
              <div>Quét mã bằng app ngân hàng/Ví điện tử để chuyển khoản đúng số tiền ${money(invoice.totalAmount)}. Nội dung chuyển khoản đã điền sẵn mã hoá đơn.</div>
              ${action}
            </div>
          </div>
        </div>`;
    } catch (e) {
      return '';
    }
  }

  // Sau khi bệnh nhân báo đã chuyển khoản: cứ 30 giây hỏi lại trạng thái hoá đơn.
  // Tiền về tài khoản có thể chậm, và hoá đơn chỉ chuyển "Đã thanh toán" khi nhân viên
  // đối chiếu sao kê xác nhận (chưa có webhook ngân hàng) — nên chờ tối đa 10 phút rồi
  // dừng, chỉ cách gọi nhân viên kiểm tra; bấm "Kiểm tra lại" để tự kiểm tra tiếp.
  const CHECK_EVERY_S = 30;
  const MAX_CHECKS = 20;
  const HOTLINE = '0974 755 333';

  function watchPayment(box) {
    const id = box.dataset.invoiceId;
    let checks = 0;
    let left = CHECK_EVERY_S;
    let timer = null;
    const recheckBtn = `<button type="button" class="pay-recheck" style="margin-top:6px; padding:5px 10px; border-radius:3px; border:1px solid var(--line); background:transparent; cursor:pointer; font-size:.8rem; color:var(--ink); font-family:inherit;">Kiểm tra lại ngay</button>`;
    const notYet = () => checks === 0 ? '' :
      `<div style="margin-top:6px; color:var(--accent-deep);">Chưa nhận được xác nhận thanh toán. Ngân hàng có thể chuyển chậm vài phút — nếu bạn đã chuyển mà vẫn chưa thấy, hãy gọi <a href="tel:${HOTLINE.replace(/\s/g, '')}">${HOTLINE}</a> để nhân viên kiểm tra lại thông tin chuyển khoản.</div>`;

    function render() {
      box.innerHTML = `⏳ Đang chờ xác nhận chuyển khoản — tự kiểm tra lại sau <b>${left}s</b>.${notYet()}${checks > 0 ? recheckBtn : ''}`;
    }
    function stop(html) {
      clearInterval(timer);
      box.innerHTML = html;
    }
    let busy = false;
    async function check() {
      if (busy) return;
      busy = true;
      left = CHECK_EVERY_S;
      checks++;
      try {
        const s = await api('/api/billing/invoices/' + id + '/payment-status');
        if (s.status === 'da_thanh_toan') {
          stop(`✅ <b>Chuyển khoản thành công.</b> Hoá đơn đã được xác nhận thanh toán lúc ${new Date(s.paidAt).toLocaleString('vi-VN')}.`);
          box.closest('.card').querySelectorAll('.pill.chua_thanh_toan').forEach((p) => {
            p.className = 'pill da_thanh_toan';
            p.textContent = STATUS_LABELS.da_thanh_toan;
          });
          return;
        }
      } catch (e) { /* lỗi mạng tạm thời — lượt sau thử lại */ }
      finally { busy = false; }
      if (checks >= MAX_CHECKS) {
        stop(`Đã chờ ${Math.round(MAX_CHECKS * CHECK_EVERY_S / 60)} phút nhưng chưa có xác nhận thanh toán. Vui lòng gọi <a href="tel:${HOTLINE.replace(/\s/g, '')}">${HOTLINE}</a> để nhân viên kiểm tra lại thông tin chuyển khoản.${recheckBtn}`);
        return;
      }
      render();
    }
    function start() {
      clearInterval(timer);
      left = CHECK_EVERY_S;
      render();
      timer = setInterval(() => { left--; if (left <= 0) check(); else render(); }, 1000);
    }
    box.addEventListener('click', (e) => {
      if (!e.target.closest('.pay-recheck')) return;
      if (checks >= MAX_CHECKS) checks = 0;
      check().then(() => { if (checks > 0 && checks < MAX_CHECKS && !box.textContent.includes('thành công')) start(); });
    });
    start();
  }

  (async function init() {
    if (!token) { document.getElementById('needLoginCard').hidden = false; return; }
    let records;
    try {
      records = (await api('/api/clinical/records/mine')).records;
    } catch (e) {
      document.getElementById('needLoginCard').hidden = false;
      return;
    }

    const list = document.getElementById('list');
    if (records.length === 0) {
      document.getElementById('emptyCard').hidden = false;
      return;
    }

    const cards = await Promise.all(records.map(async (r) => `
      <div class="card">
        <div class="record-head">
          <b>${r.specialty}</b>
          <span>${new Date(r.date).toLocaleDateString('vi-VN')} · BS. ${r.doctorName}</span>
        </div>
        ${r.symptoms ? `<div class="field"><b>Triệu chứng</b>${r.symptoms}</div>` : ''}
        <div class="field"><b>Chẩn đoán</b>${r.diagnosis}</div>
        ${r.notes ? `<div class="field"><b>Ghi chú</b>${r.notes}</div>` : ''}
        <div class="field">
          <b>Đơn thuốc ${r.code} · <a href="/in.html?type=dt&id=${r.id}" target="_blank" style="font-weight:500;">🖨 In đơn thuốc</a></b>
          ${r.items.length
            ? `<ul class="rx">${r.items.map(it => `<li>${it.medicineName} — ${it.dosage} (SL: ${it.quantity} ${it.unit})</li>`).join('')}</ul>`
            : 'Không kê đơn thuốc.'}
        </div>
        ${await invoiceHtml(r.appointmentId)}
      </div>
    `));
    list.innerHTML = cards.join('');
    list.querySelectorAll('.pay-watch').forEach(watchPayment);

    list.addEventListener('click', async (e) => {
      const viewBtn = e.target.closest('.view-invoice');
      if (viewBtn) { window.InvoiceSheet.open(invoiceById[viewBtn.dataset.invoiceId]); return; }
      const btn = e.target.closest('.claim-online-paid');
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = 'Đang xử lý...';
      try {
        await api('/api/billing/invoices/' + btn.dataset.invoiceId + '/claim-online-payment', { method: 'PATCH' });
        location.reload();
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = 'Tôi đã chuyển khoản';
      }
    });
  })();
</script>
<script src="/float-contact.js" data-zalo="0974755333"></script>
</body>
</html>
